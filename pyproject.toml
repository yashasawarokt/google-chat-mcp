[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-chat-mcp"
version = "0.3.0"
description = "MCP server for Google Chat — search spaces, DMs, and message history with real display names via People API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "google-chat", "claude", "ai"]
dependencies = [
    "mcp>=1.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "click>=8.0.0",
]

[project.scripts]
google-chat-mcp = "google_chat_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/google-chat-mcp"

[tool.hatch.build.targets.wheel]
packages = ["google_chat_mcp"]
